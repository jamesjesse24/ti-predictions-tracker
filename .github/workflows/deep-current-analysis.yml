name: Current TI deep analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - research/deep_current.py
      - .github/workflows/deep-current-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect current post-cutoff telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate collector
        run: python -m py_compile research/deep_current.py

      - name: Collect current OpenDota telemetry
        env:
          DEEP_ANALYSIS_OUT: research/deep-current-output
        run: python research/deep_current.py

      - name: Upload telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti-deep-current-20260803-2250
          path: research/deep-current-output
          if-no-files-found: error
          retention-days: 14
