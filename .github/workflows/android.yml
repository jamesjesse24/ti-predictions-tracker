name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  APP_NAME: ti-predictions-tracker

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create . \
            --platforms=android \
            --org com.jamesjesse24 \
            --project-name ti_predictions_tracker

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          OUTPUT="$RUNNER_TEMP/${APP_NAME}-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.filename }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish continuous GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create latest "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "TI Predictions Tracker - Latest" \
            --notes "Automatically built from the latest successful main-branch commit. This APK is intended for direct sideload testing."

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "TI Predictions Tracker $GITHUB_REF_NAME" \
              --generate-notes
          fi
