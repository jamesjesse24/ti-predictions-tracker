name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "data/live.json"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  APP_NAME: ti-predictions-tracker

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate data and Android scripts
        run: python -m py_compile scripts/sync_results.py tool/configure_android.py tool/fix_workmanager_r8.py

      - name: Install Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate and harden Android platform files
        run: |
          flutter create . \
            --platforms=android \
            --org com.jamesjesse24 \
            --project-name ti_predictions_tracker
          python tool/configure_android.py
          python tool/fix_workmanager_r8.py

      - name: Verify Android release protections
        shell: bash
        run: |
          grep -Fq 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -Fq 'isMinifyEnabled = false' android/app/build.gradle.kts
          grep -Fq 'isShrinkResources = false' android/app/build.gradle.kts
          grep -Fq 'WorkDatabase_Impl' android/app/proguard-rules.pro
          echo 'Network and WorkManager startup protection verified.'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          OUTPUT="$RUNNER_TEMP/${APP_NAME}-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.filename }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish continuous GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create latest "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "TI Predictions Tracker - Latest" \
            --notes "Automatically built from the latest successful main-branch commit. This APK is intended for direct sideload testing."

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "TI Predictions Tracker $GITHUB_REF_NAME" \
              --generate-notes

  research:
    name: Collect post-7.41d research artifact
    if: github.event_name == 'pull_request' && github.head_ref == 'analysis/post-741d-data'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Extract and run the isolated collector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/post-741d-data.yml').read_text(encoding='utf-8')
          start_marker = "cat > \"$RUNNER_TEMP/collect_post_741d.py\" <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/collect_post_741d.py').write_text(script, encoding='utf-8')
          PY
          mkdir -p research/post-741d/raw
          python /tmp/collect_post_741d.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti-post-741d-opendota-raw
          path: research/post-741d/raw
          if-no-files-found: error
          retention-days: 14
