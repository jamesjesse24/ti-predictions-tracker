name: Post-7.41d research PR trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/post-741d-data.yml
      - .github/workflows/post-741d-pr-trigger.yml

permissions:
  contents: read

jobs:
  collect:
    name: Collect OpenDota map telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Extract and run the isolated collector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/post-741d-data.yml').read_text(encoding='utf-8')
          start_marker = "cat > \"$RUNNER_TEMP/collect_post_741d.py\" <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/collect_post_741d.py').write_text(script, encoding='utf-8')
          PY
          mkdir -p research/post-741d/raw
          python /tmp/collect_post_741d.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti-post-741d-opendota-raw
          path: research/post-741d/raw
          if-no-files-found: error
          retention-days: 14
