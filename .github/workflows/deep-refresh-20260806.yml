name: TI deep refresh 2026-08-06

on:
  pull_request:
    branches:
      - main
    paths:
      - research/deep_refresh_20260806.py
      - .github/workflows/deep-refresh-20260806.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect August 6 post-cutoff telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download and patch validated collector
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/jamesjesse24/ti-predictions-tracker/analysis/deep-20260805-0624/research/deep_refresh_20260805.py" -o "$RUNNER_TEMP/deep_refresh.py"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "deep_refresh.py"
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "START_TS = int(datetime(2026, 8, 3, 14, 50, tzinfo=timezone.utc).timestamp())",
              "START_TS = int(datetime(2026, 8, 4, 22, 24, tzinfo=timezone.utc).timestamp())",
          )
          text = text.replace(
              "END_TS = int(datetime(2026, 8, 4, 22, 24, tzinfo=timezone.utc).timestamp())",
              "END_TS = int(datetime(2026, 8, 5, 16, 27, tzinfo=timezone.utc).timestamp())",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile "$RUNNER_TEMP/deep_refresh.py"

      - name: Collect OpenDota telemetry
        env:
          DEEP_ANALYSIS_OUT: research/deep-refresh-20260806-output
        run: python "$RUNNER_TEMP/deep_refresh.py"

      - name: Upload telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: ti-deep-refresh-20260806-0027
          path: research/deep-refresh-20260806-output
          if-no-files-found: error
          retention-days: 14
