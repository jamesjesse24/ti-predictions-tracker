name: Apply group stage panel

on:
  push:
    branches:
      - feat/group-stage-status-panel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Insert panel into dashboard
        run: python tool/inject_group_stage_panel.py

      - name: Remove temporary patch tooling
        run: |
          git rm .github/workflows/apply-group-stage-panel.yml
          git rm tool/inject_group_stage_panel.py

      - name: Commit generated source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Integrate group stage status panel"
          git push origin HEAD:${GITHUB_REF_NAME}
